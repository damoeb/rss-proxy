version: '3.4'

# envs https://medium.com/softonic-eng/docker-compose-from-development-to-production-88000124a57c

services:

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    env_file:
      - rss-proxy-selfhosted.env
    expose:
      - 5432
    networks:
      - postgres

  rss-proxy:
    image: damoeb/feedless:aio-chromium-0.3
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    security_opt:
      - seccomp=./chrome.json
    env_file:
      - rss-proxy-selfhosted.env
    networks:
      - postgres


networks:
  postgres:
    driver: bridge
