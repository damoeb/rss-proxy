version: '3.4'

# envs https://medium.com/softonic-eng/docker-compose-from-development-to-production-88000124a57c

services:

  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - selfhosting.env
    expose:
      - 5432
    networks:
      - postgres

  feedless-aio-chromium:
    image: damoeb/feedless:aio-chromium-8d4c166c87866e022154952e644de992645d32ae
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - ./ui-config.json:/usr/feedless/public/config.json
      - ./your-license.key:/usr/feedless/license.key:rw
    security_opt:
      - seccomp=./chrome.json
    env_file:
      - selfhosting.env
    networks:
      - postgres


networks:
  postgres:
    driver: bridge
